<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boîte à outils</title>
<style>
:root { --text: #f2f4fa; --soft: #c9d0e0; --dim: #98a0b6; --line: rgba(255,255,255,.12); --accent: #2fb8e8; --accent2: #1ccfb4; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); background: #0e1018; display: flex; flex-direction: column; user-select: none; overflow: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(60% 45% at 8% 0%, rgba(47,184,232,.24), transparent 70%), radial-gradient(60% 55% at 100% 100%, rgba(28,207,180,.18), transparent 70%); }
header { display: flex; align-items: center; gap: 14px; padding: 22px 26px 6px; }
header img { width: 52px; height: 52px; }
h1 { margin: 0; font: 700 25px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.sub { color: var(--soft); font-size: 13px; }
main { flex: 1; overflow-y: auto; padding: 12px 26px; }
.box { padding: 14px 16px; border-radius: 16px; margin-bottom: 12px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 1px solid var(--line); }
.box h2 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.note { color: var(--soft); font-size: 13.5px; margin-top: 6px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); font: inherit; outline: none; }
input[type=text]:focus { border-color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; margin-right: 18px; padding: 4px 0; }
.toggle i { width: 40px; height: 23px; border-radius: 12px; background: rgba(255,255,255,.2); position: relative; transition: background .15s; flex: none; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on i { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.toggle.on i::after { transform: translateX(17px); }
.choice { display: flex; gap: 14px; align-items: center; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); margin-bottom: 8px; cursor: pointer; }
.choice:hover { background: rgba(255,255,255,.08); }
.choice.on { background: rgba(47,184,232,.16); border-color: rgba(47,184,232,.55); }
.choice .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #cfd5e5; flex: none; position: relative; }
.choice.on .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #fff; }
.choice b { display: block; font-size: 15.5px; }
.choice span { color: var(--soft); font-size: 13.5px; }
ul { margin: 4px 0 0; padding-left: 18px; color: var(--soft); font-size: 13.5px; }
li { margin: 3px 0; }
footer { display: flex; align-items: center; gap: 10px; padding: 14px 26px 20px; }
footer .grow { flex: 1; color: var(--dim); font-size: 12.5px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 11px 22px; color: #fff; }
.primary { min-width: 170px; font-weight: 700; font-size: 15.5px; color: #06222b; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 26px rgba(47,184,232,.35), inset 0 1px 0 rgba(255,255,255,.35); }
.primary:hover { filter: brightness(1.1); }
.secondary { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); font-weight: 600; }
.secondary:hover { background: rgba(255,255,255,.2); }
.small { padding: 8px 14px; border-radius: 10px; }
.center { text-align: center; padding: 40px 10px; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok { color: var(--ok); font-size: 21px; font-weight: 700; }
.err { color: var(--bad); font-size: 19px; font-weight: 700; }
.warn { color: var(--warn); font-size: 13.5px; margin-top: 4px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <div><h1 id="title">Installer la Boîte à outils</h1><div class="sub" id="version"></div></div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const send = (cmd, d = {}) => window.ipc.postMessage(JSON.stringify({ cmd, ...d }));
const S = { mode: 'setup', opts: {}, task: 'repair', existing: false };

function toggle(key, label) { return `<span class="toggle${S.opts[key] ? ' on' : ''}" data-k="${key}"><i></i>${label}</span>`; }

function renderSetup() {
  const prev = S.previous || [];
  const update = S.existing || prev.length > 0;
  $('#title').textContent = update ? 'Mettre à jour la Boîte à outils' : 'Installer la Boîte à outils';
  $('#main').innerHTML = `
    ${prev.length ? `<div class="box"><div class="note" style="margin:0">${prev.map(p => `Version installée : <b>${esc(p.version || 'inconnue')}</b> dans <b>${esc(p.dir)}</b>`).join('<br>')}<br>Elle sera <b>désinstallée automatiquement</b> pendant l'installation de la version <b>${esc(S.version)}</b>. Votre historique, vos sauvegardes et vos réglages sont gardés.</div></div>` : ''}
    <div class="box"><h2>Dossier d'installation</h2>
      <div class="row"><input type="text" id="dir" value="${esc(S.opts.dir)}" spellcheck="false"><button class="secondary small" id="browse">Parcourir…</button></div>
      <div class="note">Installée pour tout le PC, dans un dossier que seuls les administrateurs peuvent modifier : la Boîte à outils fonctionne avec les droits administrateur, aucun autre programme ne doit pouvoir la remplacer.</div></div>
    <div class="box"><h2>Raccourcis</h2>
      <div class="row">${toggle('desktop', 'Bureau')}${toggle('startMenu', 'Menu Démarrer')}</div>
      <div class="note">Pour l'épingler à la barre des tâches : clic droit sur la Boîte à outils dans le menu Démarrer › Épingler à la barre des tâches.</div></div>
    <div class="box"><h2>À savoir</h2>
      <ul>
        <li>Rien n'est modifié dans Windows sans votre accord, et chaque modification s'annule depuis l'Historique.</li>
        <li>Au lancement, Windows demande l'autorisation administrateur. En la refusant, la Boîte à outils s'ouvre en mode limité (lecture et nettoyage personnel).</li>
        <li>Créée par jeremdevgit : ses autres logiciels sont dans « Mes logiciels » et sur github.com/jeremdevgit.</li>
        <li>Logiciel libre (GPL-3.0), sans publicité ni collecte de données.</li>
      </ul></div>`;
  $('#foot').innerHTML = `<span class="grow">Version ${esc(S.version)}</span><button class="secondary" id="cancel">Annuler</button><button class="primary" id="go">${update ? 'Mettre à jour' : 'Installer'}</button>`;
  document.querySelectorAll('.toggle').forEach(t => t.onclick = () => { S.opts[t.dataset.k] = !S.opts[t.dataset.k]; S.opts.dir = $('#dir').value; renderSetup(); });
  $('#browse').onclick = () => send('browse');
  $('#cancel').onclick = () => send('close');
  $('#go').onclick = () => { S.opts.dir = $('#dir').value; run('install'); };
}

function renderMaintenance() {
  $('#title').textContent = 'Gérer la Boîte à outils';
  const c = (t, title, sub) => `<div class="choice${S.task === t ? ' on' : ''}" data-t="${t}"><div class="dot"></div><div><b>${title}</b><span>${sub}</span></div></div>`;
  $('#main').innerHTML = `<div class="box"><h2>Que voulez-vous faire ?</h2>
    ${c('repair', 'Réparer', 'Restaure le programme, les raccourcis et l\'inscription dans Windows. Historique et réglages gardés.')}
    ${c('uninstall', 'Désinstaller le programme', 'Garde l\'historique et les sauvegardes : une réinstallation permettra encore d\'annuler vos modifications.')}
    ${c('uninstall-all', 'Tout désinstaller', 'Supprime aussi l\'historique, les sauvegardes du registre et des tâches, les outils Sysinternals téléchargés et les réglages.')}
    </div>
    <div class="note">Les réglages de Windows que vous avez modifiés restent tels quels. Pour revenir en arrière, annulez-les depuis l'Historique <b>avant</b> de désinstaller. La barre des tâches retrouve son aspect d'origine.</div>`;
  $('#foot').innerHTML = `<span class="grow">Version ${esc(S.version)}</span><button class="secondary" id="cancel">Annuler</button><button class="primary" id="go">${S.task === 'repair' ? 'Réparer' : 'Désinstaller'}</button>`;
  document.querySelectorAll('.choice').forEach(x => x.onclick = () => { S.task = x.dataset.t; renderMaintenance(); });
  $('#cancel').onclick = () => send('close');
  $('#go').onclick = () => run(S.task);
}

function run(task) {
  S.task = task;
  $('#main').innerHTML = `<div class="center"><div class="spinner"></div><div id="step" style="font-size:15.5px">Préparation…</div></div>`;
  $('#foot').innerHTML = '';
  send('run', { task, opts: S.opts });
}

function done(m) {
  const uninstall = S.task.startsWith('uninstall');
  if (!m.ok) {
    $('#main').innerHTML = `<div class="box"><div class="err">L'opération n'a pas abouti</div><div class="note">${esc(m.error)}</div></div>`;
    $('#foot').innerHTML = `<span class="grow"></span><button class="secondary" id="cancel">Fermer</button><button class="primary" id="retry">Réessayer</button>`;
    $('#cancel').onclick = () => send('close');
    $('#retry').onclick = () => (S.mode === 'setup' ? renderSetup() : renderMaintenance());
    return;
  }
  const title = { install: S.existing ? 'La Boîte à outils est à jour ✔' : 'La Boîte à outils est installée ✔', repair: 'La Boîte à outils est réparée ✔', uninstall: 'La Boîte à outils est désinstallée ✔', 'uninstall-all': 'La Boîte à outils et ses données sont supprimées ✔' }[S.task];
  let html = `<div class="box"><div class="ok">${title}</div>`;
  if (S.task === 'uninstall') html += `<div class="note">L'historique et les sauvegardes restent dans votre dossier AppData\\Local\\BoiteAOutils pour une prochaine installation.</div>`;
  for (const n of m.notes || []) html += `<div class="warn">⚠ ${esc(n)}</div>`;
  if (!uninstall) html += `<div class="row" style="margin-top:12px"><span class="toggle on" id="launch"><i></i>Lancer la Boîte à outils maintenant</span></div>`;
  $('#main').innerHTML = html + '</div>';
  $('#foot').innerHTML = `<span class="grow"></span><button class="primary" id="finish">Terminer</button>`;
  $('#launch')?.addEventListener('click', e => e.currentTarget.classList.toggle('on'));
  $('#finish').onclick = () => { if (!uninstall && $('#launch')?.classList.contains('on')) send('launch'); send('close'); };
}

window.setup = {
  recv(m) {
    if (m.type === 'init') {
      Object.assign(S, m);
      $('#version').textContent = 'Démarrage, services, nettoyage et entretien de Windows · version ' + m.version;
      S.mode === 'setup' ? renderSetup() : renderMaintenance();
    } else if (m.type === 'dir') { S.opts.dir = m.dir; $('#dir').value = m.dir; }
    else if (m.type === 'step') { const s = $('#step'); if (s) s.textContent = m.text; }
    else if (m.type === 'done') done(m);
  },
};
send('init');
</script>
</body>
</html>
