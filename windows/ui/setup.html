<!doctype html>

<style>
:root { --text: #f2f4fa; --soft: #c9d0e0; --dim: #98a0b6; --line: rgba(255,255,255,.12); --accent: #2fb8e8; --accent2: #1ccfb4; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); background: #0e1018; display: flex; flex-direction: column; user-select: none; overflow: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(60% 45% at 8% 0%, rgba(47,184,232,.24), transparent 70%), radial-gradient(60% 55% at 100% 100%, rgba(28,207,180,.18), transparent 70%); }
header { display: flex; align-items: center; gap: 14px; padding: 22px 26px 6px; }
header img { width: 52px; height: 52px; }
h1 { margin: 0; font: 700 25px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.sub { color: var(--soft); font-size: 13px; }
main { flex: 1; overflow-y: auto; padding: 12px 26px; }
.box { padding: 14px 16px; border-radius: 16px; margin-bottom: 12px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 1px solid var(--line); }
.box h2 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.note { color: var(--soft); font-size: 13.5px; margin-top: 6px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); font: inherit; outline: none; }
input[type=text]:focus { border-color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; margin-right: 18px; padding: 4px 0; }
.toggle i { width: 40px; height: 23px; border-radius: 12px; background: rgba(255,255,255,.2); position: relative; transition: background .15s; flex: none; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on i { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.toggle.on i::after { transform: translateX(17px); }
.choice { display: flex; gap: 14px; align-items: center; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); margin-bottom: 8px; cursor: pointer; }
.choice:hover { background: rgba(255,255,255,.08); }
.choice.on { background: rgba(47,184,232,.16); border-color: rgba(47,184,232,.55); }
.choice .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #cfd5e5; flex: none; position: relative; }
.choice.on .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #fff; }
.choice b { display: block; font-size: 15.5px; }
.choice span { color: var(--soft); font-size: 13.5px; }
ul { margin: 4px 0 0; padding-left: 18px; color: var(--soft); font-size: 13.5px; }
li { margin: 3px 0; }
footer { display: flex; align-items: center; gap: 10px; padding: 14px 26px 20px; }
footer .grow { flex: 1; color: var(--dim); font-size: 12.5px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 11px 22px; color: #fff; }
.primary { min-width: 170px; font-weight: 700; font-size: 15.5px; color: #06222b; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 26px rgba(47,184,232,.35), inset 0 1px 0 rgba(255,255,255,.35); }
.primary:hover { filter: brightness(1.1); }
.secondary { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); font-weight: 600; }
.secondary:hover { background: rgba(255,255,255,.2); }
.small { padding: 8px 14px; border-radius: 10px; }
.center { text-align: center; padding: 40px 10px; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok { color: var(--ok); font-size: 21px; font-weight: 700; }
.err { color: var(--bad); font-size: 19px; font-weight: 700; }
.warn { color: var(--warn); font-size: 13.5px; margin-top: 4px; }
[hidden] { display: none !important; }
</style>
</head>

 tareas: clic derecho en Boîte à outils en el menú Inicio › Anclar a la barra de tareas.","Zum Anheften an die Taskleiste: Rechtsklick auf Boîte à outils im Startmenü › An Taskleiste anheften.","Per aggiungerla alla barra delle applicazioni: clic destro su Boîte à outils nel menu Start › Aggiungi alla barra delle applicazioni.","Para fixar na barra de tarefas: clique com o botão direito no Boîte à outils no menu Iniciar › Fixar na barra de tarefas.","固定到任务栏：在“开始”菜单中右键单击 Boîte à outils › 固定到任务栏。","タスク バーにピン留めするには：スタート メニューで Boîte à outils を右クリック › タスク バーにピン留めする。"],"À savoir":["Good to know","Conviene saber","Gut zu wissen","Da sapere","Bom saber","须知","ご注意"],"Rien n'est modifié dans Windows sans votre accord, et chaque modification s'annule depuis l'Historique.":["Nothing in Windows is changed without your consent, and every change can be undone from History.","No se modifica nada en Windows sin tu consentimiento, y cada cambio se deshace desde el Historial.","Ohne Ihre Zustimmung wird nichts an Windows geändert, und jede Änderung lässt sich im Verlauf rückgängig machen.","Niente viene modificato in Windows senza il tuo consenso, e ogni modifica si annulla dalla Cronologia.","Nada é alterado no Windows sem a sua permissão, e cada alteração pode ser desfeita pelo Histórico.","未经你同意不会修改 Windows 的任何内容，每项修改都可在“历史记录”中撤销。","同意なしに Windows が変更されることはなく、すべての変更は [履歴] から元に戻せます。"],"Au lancement, Windows demande l'autorisation administrateur. En la refusant, la Boîte à outils s'ouvre en mode limité (lecture et nettoyage personnel).":["At launch, Windows asks for administrator permission. If you decline, Boîte à outils opens in limited mode (viewing and personal cleanup).","Al abrirla, Windows pide permiso de administrador. Si lo rechazas, Boîte à outils se abre en modo limitado (consulta y limpieza personal).","Beim Start fragt Windows nach der Administratorberechtigung. Lehnen Sie ab, öffnet sich Boîte à outils im eingeschränkten Modus (Anzeige und persönliche Bereinigung).","All'avvio, Windows chiede l'autorizzazione di amministratore. Se la rifiuti, Boîte à outils si apre in modalità limitata (consultazione e pulizia personale).","Ao abrir, o Windows pede permissão de administrador. Se você recusar, o Boîte à outils abre em modo limitado (consulta e limpeza pessoal).","启动时 Windows 会请求管理员权限。若拒绝，Boîte à outils 将以受限模式打开（仅查看和个人清理）。","起動時に Windows が管理者の許可を求めます。拒否すると、Boîte à outils は制限モード（閲覧と個人用のクリーンアップ）で開きます。"],"Créée par jeremdevgit : ses autres logiciels sont dans « Mes logiciels » et sur github.com/jeremdevgit.":["Made by jeremdevgit: more software in “My software” and at github.com/jeremdevgit.","Creada por jeremdevgit: sus otros programas están en «Mis programas» y en github.com/jeremdevgit.","Von jeremdevgit: weitere Programme unter „Meine Programme“ und auf github.com/jeremdevgit.","Creata da jeremdevgit: gli altri suoi programmi sono in «I miei programmi» e su github.com/jeremdevgit.","Criado por jeremdevgit: os outros programas estão em “Meus programas” e em github.com/jeremdevgit.","由 jeremdevgit 开发：其他软件见“我的软件”和 github.com/jeremdevgit。","作者 jeremdevgit：ほかのソフトは「マイ ソフトウェア」と github.com/jeremdevgit にあります。"],"Logiciel libre (GPL-3.0), sans publicité ni collecte de données.":["Free software (GPL-3.0), with no ads and no data collection.","Software libre (GPL-3.0), sin publicidad ni recopilación de datos.","Freie Software (GPL-3.0), ohne Werbung und ohne Datensammlung.","Software libero (GPL-3.0), senza pubblicità né raccolta di dati.","Software livre (GPL-3.0), sem anúncios nem coleta de dados.","自由软件（GPL-3.0），无广告，不收集数据。","フリーソフトウェア（GPL-3.0）。広告もデータ収集もありません。"],"Version {v}":["Version {v}","Versión {v}","Version {v}","Versione {v}","Versão {v}","版本 {v}","バージョン {v}"],"Annuler":["Cancel","Cancelar","Abbrechen","Annulla","Cancelar","取消","キャンセル"],"Mettre à jour":["Update","Actualizar","Aktualisieren","Aggiorna","Atualizar","更新","更新"],"Installer":["Install","Instalar","Installieren","Installa","Instalar","安装","インストール"],"Gérer la Boîte à outils":[ ます。"],"Tout désinstaller":["Uninstall everything","Desinstalar todo","Alles deinstallieren","Disinstalla tutto","Desinstalar tudo","全部卸载","すべてアンインストール"],"Supprime aussi l'historique, les sauvegardes du registre et des tâches, les outils Sysinternals téléchargés et les réglages.":["Also deletes the history, the registry and task backups, the downloaded Sysinternals tools and the settings.","También elimina el historial, las copias del registro y de las tareas, las herramientas Sysinternals descargadas y los ajustes.","Löscht auch den Verlauf, die Registry- und Aufgabensicherungen, die heruntergeladenen Sysinternals-Tools und die Einstellungen.","Elimina anche la cronologia, i backup del registro e delle attività, gli strumenti Sysinternals scaricati e le impostazioni.","Também apaga o histórico, os backups do registro e das tarefas, as ferramentas Sysinternals baixadas e as configurações.","同时删除历史记录、注册表和任务的备份、已下载的 Sysinternals 工具以及设置。","履歴、レジストリとタスクのバックアップ、ダウンロードした Sysinternals ツール、設定も削除します。"],"Les réglages de Windows que vous avez modifiés restent tels quels. Pour revenir en arrière, annulez-les depuis l'Historique <b>avant</b> de désinstaller. La barre des tâches retrouve son aspect d'origine.":["The Windows settings you changed stay as they are. To go back, undo them from History <b>before</b> uninstalling. The taskbar returns to its original look.","Los ajustes de Windows que modificaste se quedan como están. Para volver atrás, deshazlos desde el Historial <b>antes</b> de desinstalar. La barra de tareas recupera su aspecto original.","Die geänderten Windows-Einstellungen bleiben, wie sie sind. Um sie zurückzusetzen, machen Sie sie <b>vor</b> der Deinstallation im Verlauf rückgängig. Die Taskleiste erhält ihr ursprüngliches Aussehen zurück.","Le impostazioni di Windows che hai modificato restano invariate. Per tornare indietro, annullale dalla Cronologia <b>prima</b> di disinstallare. La barra delle applicazioni torna all'aspetto originale.","As configurações do Windows que você alterou ficam como estão. Para voltar atrás, desfaça-as pelo Histórico <b>antes</b> de desinstalar. A barra de tarefas volta à aparência original.","你修改过的 Windows 设置会保持不变。如需恢复，请在卸载<b>之前</b>从“历史记录”中撤销。任务栏会恢复原样。","変更した Windows の設定はそのまま残ります。元に戻すには、アンインストールする<b>前に</b> [履歴] から取り消してください。タスク バーは元の外観に戻ります。"],"Désinstaller":["Uninstall","Desinstalar","Deinstallieren","Disinstalla","Desinstalar","卸载","アンインストール"],"Préparation…":["Preparing…","Preparando…","Vorbereitung…","Preparazione…","Preparando…","正在准备…","準備しています…"],"L'opération n'a pas abouti":["The operation didn't complete","La operación no se completó","Der Vorgang ist fehlgeschlagen","L'operazione non è riuscita","A operação não foi concluída","操作未完成","処理を完了できませんでした"],"Fermer":["Close","Cerrar","Schließen","Chiudi","Fechar","关闭","閉じる"],"Réessayer":["Try again","Reintentar","Erneut versuchen","Riprova","Tentar novamente","重试","再試行"],"La Boîte à outils est à jour ✔":["Boîte à outils is up to date ✔","Boîte à outils está actualizada ✔","Boîte à outils ist auf dem neuesten Stand ✔","Boîte à outils è aggiornata ✔","O Boîte à outils está atualizado ✔","Boîte à outils 已是最新版本 ✔","Boîte à outils は最新です ✔"],"La Boîte à outils est installée ✔":["Boîte à outils is installed ✔","Boîte à outils está instalada ✔","Boîte à outils ist installiert ✔","Boîte à outils è installata ✔","O Boîte à outils está instalado ✔","Boîte à outils 已安装 ✔","Boîte à outils をインストールしました ✔"],"La Boîte à outils est réparée ✔":["Boîte à outils is repaired ✔","Boîte à outils está reparada ✔","Boîte à outils ist repariert ✔","Boîte à outils è stata riparata ✔","O Boîte à outils foi reparado ✔","Boîte à outils 已修复 ✔","Boîte à outils を修復しました ✔"],"La Boîte à outils est désinstallée ✔":["Boîte à outils is uninstalled ✔","Boîte à outils está desinstalada ✔","Boîte à outils ist deinstalliert ✔","Boîte à outils è stata disinstallata ✔","O Boîte à outils foi desinstalado ✔","Boîte à outils 已卸载 ✔","Boîte à outils をアンインストールしました ✔"],"La Boîte à outils et ses données sont supprimées ✔":["Boîte à outils and its data are deleted ✔","Boîte à outils y sus datos se han eliminado ✔","Boîte à outils und ihre Daten sind gelöscht ✔","Boîte à outils e i suoi dati sono stati eliminati ✔","O Boîte à outils e seus dados foram apagados ✔","Boîte à outils 及其数据已删除 ✔","Boîte à outils とそのデータを削除しました ✔"],"L'historique et les sauvegardes restent dans votre dossier AppData\\Local\\BoiteAOutils pour une prochaine installation.":["The history and backups stay in your AppData\\Local\\BoiteAOutils folder for a future installation.","El historial y las copias de seguridad se quedan en tu carpeta AppData\\Local\\BoiteAOutils para una próxima instalación.","Verlauf und Sicherungen bleiben für eine spätere Installation in Ihrem Ordner AppData\\Local\\BoiteAOutils.","La cronologia e i backup restano nella cartella AppData\\Local\\BoiteAOutils per una prossima installazione.","O histórico e os backups ficam na sua pasta AppData\\Local\\BoiteAOutils para uma próxima instalação.","历史记录和备份会保留在你的 AppData\\Local\\BoiteAOutils 文件夹中，供下次安装使用。","履歴とバックアップは、次回のインストールのために AppData\\Local\\BoiteAOutils フォルダーに残ります。"],"Lancer la Boîte à outils maintenant":["Launch Boîte à outils now","Abrir Boîte à outils ahora","Boîte à outils jetzt starten","Avvia Boîte à outils ora","Abrir o Boîte à outils agora","立即启动 Boîte à outils","今すぐ Boîte à outils を起動"],"Terminer":["Finish","Finalizar","Fertig stellen","Fine","Concluir","完成","完了"],"Démarrage, services, nettoyage et entretien de Windows · version {v}":["Windows startup, services, cleanup and maintenance · version {v}","Inicio, servicios, limpieza y mantenimiento de Windows · versión {v}","Autostart, Dienste, Bereinigung und Wartung von Windows · Version {v}","Avvio, servizi, pulizia e manutenzione di Windows · versione {v}","Inicialização, serviços, limpeza e manutenção do Windows · versão {v}","Windows 启动项、服务、清理与维护 · 版本 {v}","Windows のスタートアップ、サービス、クリーンアップ、メンテナンス · バージョン {v}"],"Indiquez un chemin complet, par exemple C:\\Program Files\\BoiteAOutils":["Enter a full path, for example C:\\Program Files\\BoiteAOutils","Indica una ruta completa, por ejemplo C:\\Program Files\\BoiteAOutils","Geben Sie einen vollständigen Pfad an, zum Beispiel C:\\Program Files\\BoiteAOutils","Indica un percorso completo, ad esempio C:\\Program Files\\BoiteAOutils","Informe um caminho completo, por exemplo C:\\Program Files\\BoiteAOutils","请输入完整路径，例如 C:\\Program Files\\BoiteAOutils","完全なパスを入力してください（例：C:\\Program Files\\BoiteAOutils）"],"Le chemin contient des caractères interdits.":["The path contains characters that aren't allowed.","La ruta contiene caracteres no permitidos.","Der Pfad enthält unzulässige Zeichen.","Il percorso contiene caratteri non consentiti.","O caminho contém caracteres não permitidos.","路径包含不允许的字符。","パスに使用できない文字が含まれています。"],"Impossible d'installer dans le dossier de Windows.":["Can't install into the Windows folder.","No se puede instalar en la carpeta de Windows.","Installation im Windows-Ordner nicht möglich.","Impossibile installare nella cartella di Windows.","Não é possível instalar na pasta do Windows.","无法安装到 Windows 文件夹。","Windows フォルダーにはインストールできません。"],"Choisissez un dossier hors de votre profil (Program Files par exemple) : la Boîte à outils fonctionne en administrateur et son dossier doit être protégé.":["Choose a folder outside your profile (Program Files, for example): Boîte à outils runs as administrator and its folder must be protected.","Elige una carpeta fuera de tu perfil (Program Files, por ejemplo): Boîte à outils funciona como administrador y su carpeta debe estar protegida.","Wählen Sie einen Ordner außerhalb Ihres Profils (zum Beispiel Program Files): Boîte à outils läuft als Administrator, ihr Ordner muss geschützt sein.","Scegli una cartella fuori dal tuo profilo (ad esempio Program Files): Boîte à outils funziona come amministratore e la sua cartella deve essere protetta.","Escolha uma pasta fora do seu perfil (Program Files, por exemplo): o Boîte à outils roda como administrador e a pasta dele precisa ser protegida.","请选择个人文件夹以外的位置（例如 Program Files）：Boîte à outils 以管理员身份运行，其文件夹必须受到保护。","プロファイル外のフォルダー（Program Files など）を選んでください。Boîte à outils は管理者として動作するため、そのフォルダーは保護されている必要があります。"],"Version {0} trouvée dans {1}":["Version {0} found in {1}","Versión {0} encontrada en {1}","Version {0} gefunden in {1}","Versione {0} trovata in {1}","Versão {0} encontrada em {1}","在 {1} 中找到版本 {0}","{1} にバージョン {0} が見つかりました"],"Fermeture de la Boîte à outils si elle est ouverte…":["Closing Boîte à outils if it's open…","Cerrando Boîte à outils si está abierta…","Boîte à outils wird geschlossen, falls geöffnet…","Chiusura di Boîte à outils se è aperta…","Fechando o Boîte à outils se estiver aberto…","正在关闭 Boîte à outils（如已打开）…","Boîte à outils が開いていれば終了しています…"],"Copie des fichiers…":["Copying files…","Copiando archivos…","Dateien werden kopiert…","Copia dei file…","Copiando arquivos…","正在复制文件…","ファイルをコピーしています…"],"Impossible de créer le dossier":["Can't create the folder","No se puede crear la carpeta","Ordner kann nicht erstellt werden","Impossibile creare la cartella","Não foi possível criar a pasta","无法创建文件夹","フォルダーを作成できません"],"Copie de BoiteAOutils.exe impossible":["Can't copy BoiteAOutils.exe","No se puede copiar BoiteAOutils.exe","BoiteAOutils.exe kann nicht kopiert werden","Impossibile copiare BoiteAOutils.exe","Não foi possível copiar o BoiteAOutils.exe","无法复制 BoiteAOutils.exe","BoiteAOutils.exe をコピーできません"],"Copie du programme de désinstallation impossible":["Can't copy the uninstaller","No se puede copiar el desinstalador","Deinstallationsprogramm kann nicht kopiert werden","Impossibile copiare il programma di disinstallazione","Não foi possível copiar o desinstalador","无法复制卸载程序","アンインストーラーをコピーできません"],"Désinstallation de l'ancienne version {0}…":["Uninstalling the old version {0}…","Desinstalando la versión anterior {0}…","Alte Version {0} wird deinstalliert…","Disinstallazione della versione precedente {0}…","Desinstalando a versão antiga {0}…","正在卸载旧版本 {0}…","古いバージョン {0} をアンインストールしています…"],"Ancienne version {0} désinstallée ({1}).":["Old version {0} uninstalled ({1}).","Versión anterior {0} desinstalada ({1}).","Alte Version {0} deinstalliert ({1}).","Versione precedente {0} disinstallata ({1}).","Versão antiga {0} desinstalada ({1}).","已卸载旧版本 {0}（{1}）。","古いバージョン {0} をアンインストールしました（{1}）。"],"Raccourcis…":["Shortcuts…","Accesos directos…","Verknüpfungen…","Collegamenti…","Atalhos…","快捷方式…","ショートカット…"],"Raccourci non créé":["Shortcut not created","Acceso directo no creado","Verknüpfung nicht erstellt","Collegamento non creato","Atalho não criado","未创建快捷方式","ショートカットを作成できませんでした"],"Inscription dans Windows…":["Registering with Windows…","Registrando en Windows…","Registrierung in Windows…","Registrazione in Windows…","Registrando no Windows…","正在向 Windows 注册…","Windows に登録しています…"],"La barre des tâches transparente utilise maintenant la version installée.":["The transparent taskbar now uses the installed version.","La barra de tareas transparente usa ahora la versión instalada.","Die transparente Taskleiste verwendet jetzt die installierte Version.","La barra delle applicazioni trasparente ora usa la versione installata.","A barra de tarefas transparente agora usa a versão instalada.","透明任务栏现在使用已安装的版本。","透明なタスク バーはインストールされたバージョンを使うようになりました。"],"Installation introuvable":["Installation not found","No se encuentra la instalación","Installation nicht gefunden","Installazione non trovata","Instalação não encontrada","找不到安装","インストールが見つかりません"],"Barre des tâches d'origine…":["Original taskbar…","Barra de tareas original…","Ursprüngliche Taskleiste…","Barra delle applicazioni originale…","Barra de tarefas original…","恢复原始任务栏…","元のタスク バー…"],"Fermeture de la Boîte à outils…":["Closing Boîte à outils…","Cerrando Boîte à outils…","Boîte à outils wird geschlossen…","Chiusura di Boîte à outils…","Fechando o Boîte à outils…","正在关闭 Boîte à outils…","Boîte à outils を終了しています…"],"Suppression des fichiers…":["Deleting files…","Eliminando archivos…","Dateien werden gelöscht…","Eliminazione dei file…","Apagando arquivos…","正在删除文件…","ファイルを削除しています…"],"Retrait de l'inscription Windows…":["Removing the Windows registration…","Quitando el registro de Windows…","Windows-Registrierung wird entfernt…","Rimozione della registrazione in Windows…","Removendo o registro do Windows…","正在移除 Windows 注册…","Windows への登録を解除しています…"],"action inconnue":["unknown action","acción desconocida","unbekannte Aktion","azione sconosciuta","ação desconhecida","未知操作","不明な操作"]}/*FIN*/;
const tr1 = s => (TEXTES[s] || [])[LANGS.indexOf(LANG) - 1];
const T = (s, v) => String(tr1(s) || s).replace(/\{(\w+)\}/g, (m, k) => (v && k in v ? v[k] : m));
// message du programme : texte fixe, modèle (« Version {0} trouvée dans {1} ») ou début de message (« … : détail »)
const MODELES = Object.keys(TEXTES).filter(k => /\{\d\}/.test(k)).map(k => [new RegExp('^' + k.replace(/[.*+?^$()|[\]\\]/g, '\\$&').replace(/\\?\{\d\\?\}/g, '(.+?)') + '$'), k]);
const TM = m => {
  m = String(m || '');
  if (LANG === 'fr') return m;
  if (tr1(m)) return tr1(m);
  for (const [re, k] of MODELES) { const r = re.exec(m); if (r) return T(k, Object.fromEntries(r.slice(1).map((x, i) => [i, tr1(x) || x]))); }
  const i = m.indexOf(' : ');
  return i > 0 && tr1(m.slice(0, i)) ? tr1(m.slice(0, i)) + (LANG === 'zh' || LANG === 'ja' ? '：' : ': ') + m.slice(i + 3) : m;
};
document.documentElement.lang = LANG;

function toggle(key, label) { return `<span class="toggle${S.opts[key] ? ' on' : ''}" data-k="${key}"><i></i>${label}</span>`; }

function renderSetup() {
  const prev = S.previous || [];
  const update = S.existing || prev.length > 0;
  $('#title').textContent = T(update ? 'Mettre à jour la Boîte à outils' : 'Installer la Boîte à outils');
  $('#main').innerHTML = `
    ${prev.length ? `<div class="box"><div class="note" style="margin:0">${prev.map(p => T('Version installée : <b>{v}</b> dans <b>{d}</b>', { v: esc(p.version || T('inconnue')), d: esc(p.dir) })).join('<br>')}<br>${T("Elle sera <b>désinstallée automatiquement</b> pendant l'installation de la version <b>{v}</b>. Votre historique, vos sauvegardes et vos réglages sont gardés.", { v: esc(S.version) })}</div></div>` : ''}
    <div class="box"><h2>${T("Dossier d'installation")}</h2>
      <div class="row"><input type="text" id="dir" value="${esc(S.opts.dir)}" spellcheck="false"><button class="secondary small" id="browse">${T('Parcourir…')}</button></div>
      <div class="note">${T('Installée pour tout le PC, dans un dossier que seuls les administrateurs peuvent modifier : la Boîte à outils fonctionne avec les droits administrateur, aucun autre programme ne doit pouvoir la remplacer.')}</div></div>
    <div class="box"><h2>${T('Raccourcis')}</h2>
      <div class="row">${toggle('desktop', T('Bureau'))}${toggle('startMenu', T('Menu Démarrer'))}</div>
      <div class="note">${T("Pour l'épingler à la barre des tâches : clic droit sur la Boîte à outils dans le menu Démarrer › Épingler à la barre des tâches.")}</div></div>
    <div class="box"><h2>${T('À savoir')}</h2>
      <ul>
        <li>${T("Rien n'est modifié dans Windows sans votre accord, et chaque modification s'annule depuis l'Historique.")}</li>
        <li>${T("Au lancement, Windows demande l'autorisation administrateur. En la refusant, la Boîte à outils s'ouvre en mode limité (lecture et nettoyage personnel).")}</li>
        <li>${T("Créée par jeremdevgit : ses autres logiciels sont dans « Mes logiciels » et sur github.com/jeremdevgit.")}</li>
        <li>${T("Logiciel libre (GPL-3.0), sans publicité ni collecte de données.")}</li>
      </ul></div>`;
  $('#foot').innerHTML = `<span class="grow">${T('Version {v}', { v: esc(S.version) })}</span><button class="secondary" id="cancel">${T('Annuler')}</button><button class="primary" id="go">${T(update ? 'Mettre à jour' : 'Installer')}</button>`;
  document.querySelectorAll('.toggle').forEach(t => t.onclick = () => { S.opts[t.dataset.k] = !S.opts[t.dataset.k]; S.opts.dir = $('#dir').value; renderSetup(); });
  $('#browse').onclick = () => send('browse');
  $('#cancel').onclick = () => send('close');
  $('#go').onclick = () => { S.opts.dir = $('#dir').value; run('install'); };
}

function renderMaintenance() {
  $('#title').textContent = T('Gérer la Boîte à outils');
  const c = (t, title, sub) => `<div class="choice${S.task === t ? ' on' : ''}" data-t="${t}"><div class="dot"></div><div><b>${T(title)}</b><span>${T(sub)}</span></div></div>`;
  $('#main').innerHTML = `<div class="box"><h2>${T('Que voulez-vous faire ?')}</h2>
    ${c('repair', 'Réparer', 'Restaure le programme, les raccourcis et l\'inscription dans Windows. Historique et réglages gardés.')}
    ${c('uninstall', 'Désinstaller le programme', 'Garde l\'historique et les sauvegardes : une réinstallation permettra encore d\'annuler vos modifications.')}
    ${c('uninstall-all', 'Tout désinstaller', 'Supprime aussi l\'historique, les sauvegardes du registre et des tâches, les outils Sysinternals téléchargés et les réglages.')}
    </div>
    <div class="note">${T("Les réglages de Windows que vous avez modifiés restent tels quels. Pour revenir en arrière, annulez-les depuis l'Historique <b>avant</b> de désinstaller. La barre des tâches retrouve son aspect d'origine.")}</div>`;
  $('#foot').innerHTML = `<span class="grow">${T('Version {v}', { v: esc(S.version) })}</span><button class="secondary" id="cancel">${T('Annuler')}</button><button class="primary" id="go">${T(S.task === 'repair' ? 'Réparer' : 'Désinstaller')}</button>`;
  document.querySelectorAll('.choice').forEach(x => x.onclick = () => { S.task = x.dataset.t; renderMaintenance(); });
  $('#cancel').onclick = () => send('close');
  $('#go').onclick = () => run(S.task);
}

function run(task) {
  S.task = task;
  $('#main').innerHTML = `<div class="center"><div class="spinner"></div><div id="step" style="font-size:15.5px">${T('Préparation…')}</div></div>`;
  $('#foot').innerHTML = '';
  send('run', { task, opts: S.opts, lang: LANG });
}

function done(m) {
  const uninstall = S.task.startsWith('uninstall');
  if (!m.ok) {
    $('#main').innerHTML = `<div class="box"><div class="err">${T("L'opération n'a pas abouti")}</div><div class="note">${esc(TM(m.error))}</div></div>`;
    $('#foot').innerHTML = `<span class="grow"></span><button class="secondary" id="cancel">${T('Fermer')}</button><button class="primary" id="retry">${T('Réessayer')}</button>`;
    $('#cancel').onclick = () => send('close');
    $('#retry').onclick = () => (S.mode === 'setup' ? renderSetup() : renderMaintenance());
    return;
  }
  const title = { install: S.existing ? 'La Boîte à outils est à jour ✔' : 'La Boîte à outils est installée ✔', repair: 'La Boîte à outils est réparée ✔', uninstall: 'La Boîte à outils est désinstallée ✔', 'uninstall-all': 'La Boîte à outils et ses données sont supprimées ✔' }[S.task];
  let html = `<div class="box"><div class="ok">${T(title)}</div>`;
  if (S.task === 'uninstall') html += `<div class="note">${T('L\'historique et les sauvegardes restent dans votre dossier AppData\\Local\\BoiteAOutils pour une prochaine installation.')}</div>`;
  for (const n of m.notes || []) html += `<div class="warn">⚠ ${esc(TM(n))}</div>`;
  if (!uninstall) html += `<div class="row" style="margin-top:12px"><span class="toggle on" id="launch"><i></i>${T('Lancer la Boîte à outils maintenant')}</span></div>`;
  $('#main').innerHTML = html + '</div>';
  $('#foot').innerHTML = `<span class="grow"></span><button class="primary" id="finish">${T('Terminer')}</button>`;
  $('#launch')?.addEventListener('click', e => e.currentTarget.classList.toggle('on'));
  $('#finish').onclick = () => { if (!uninstall && $('#launch')?.classList.contains('on')) send('launch'); send('close'); };
}

window.setup = {
  recv(m) {
    if (m.type === 'init') {
      Object.assign(S, m);
      $('#version').textContent = T('Démarrage, services, nettoyage et entretien de Windows · version {v}', { v: m.version });
      S.mode === 'setup' ? renderSetup() : renderMaintenance();
    } else if (m.type === 'dir') { S.opts.dir = m.dir; $('#dir').value = m.dir; }
    else if (m.type === 'step') { const s = $('#step'); if (s) s.textContent = TM(m.text); }
    else if (m.type === 'done') done(m);
  },
};
$('#title').textContent = T('Installer la Boîte à outils');
send('init', { lang: LANG });
</script>
</body>
</html>
