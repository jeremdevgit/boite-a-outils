[package]
name = "boite-a-outils"
version = "2.3.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Boîte à outils : démarrage, services, nettoyage et entretien de Windows, sans rien casser"

[[bin]]
name = "BoiteAOutils"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_AppLocker", "Win32_System_Pipes", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_Power", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Devices_Usb", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_Devices_Properties"] }

[features]
# Hooks de test (BAO_TEST) : jamais dans une version distribuée
test-hooks = []

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
